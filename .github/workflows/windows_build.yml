name: Windows Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - name: Restore
        run: nuget restore LittleBigMouse.sln
      - name: Build Release x64
        run: msbuild LittleBigMouse.sln /m /p:Configuration=Release /p:Platform=x64
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build installer
        run: iscc LittleBigMouse.Setup\LittleBigMouse.iss
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LittleBigMouse-Installer
          path: LittleBigMouse.Setup\*.exe
